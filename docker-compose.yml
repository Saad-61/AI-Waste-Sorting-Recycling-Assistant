version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waste_sorting_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./app_data.db
    volumes:
      - ./backend/weights:/app/weights
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waste_sorting_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
